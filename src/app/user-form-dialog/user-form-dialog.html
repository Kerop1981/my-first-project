<h2 mat-dialog-title>
  {{ data ? 'Редактировать пользователя' : 'Создать пользователя' }}
</h2>

<form [formGroup]="form" mat-dialog-content>
  <mat-form-field class="w-full">
    <mat-label>Имя</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" />
  </mat-form-field>
</form>

<mat-dialog-actions align ="end">
  <button mat-button mat-dialog-close>Отмена</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="form.value" [disabled]="form.invalid">
    {{ data ? 'Сохранить' : 'Создать' }}
  </button>
</mat-dialog-actions>
